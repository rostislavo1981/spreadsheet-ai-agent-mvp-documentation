<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #ffffff; --panel: #f7f7f8; --border: #e5e5e5; --text: #1a1a1a;
      --muted: #6b7280; --accent: #2563eb; --user: #2563eb; --bot: #f3f4f6;
      --warn: #d97706; --ok: #16a34a; --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; font-size: 13px;
           margin: 0; color: var(--text); background: var(--bg); height: 100vh;
           display: flex; flex-direction: column; }
    header { padding: 8px 10px; border-bottom: 1px solid var(--border);
             display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    header b { font-size: 13px; }
    #ctx { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
    select { font-size: 12px; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--border); }
    #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 92%; padding: 8px 10px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: #fff; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .msg.bot h1, .msg.bot h2, .msg.bot h3 { font-size: 13px; margin: 6px 0 3px; }
    .msg.bot code { background: #e5e7eb; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    .msg.bot pre { background: #1f2937; color: #f9fafb; padding: 8px; border-radius: 6px;
                   overflow-x: auto; font-size: 11.5px; }
    .msg.bot pre code { background: none; color: inherit; padding: 0; }
    .msg.bot ul, .msg.bot ol { margin: 4px 0; padding-left: 18px; }
    .plan { align-self: flex-start; background: #fff; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px; max-width: 94%; width: 94%; }
    .plan h4 { margin: 0 0 6px; font-size: 12.5px; }
    .plan .risk { font-weight: 600; }
    .plan .act { padding: 4px 0; border-top: 1px solid var(--border); font-size: 12px; }
    .plan .act:first-of-type { border-top: none; }
    .plan .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .bar { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; gap: 6px;
           flex-shrink: 0; align-items: flex-end; }
    #prompt { flex: 1; height: 38px; resize: none; border: 1px solid var(--border);
              border-radius: 8px; padding: 8px; font: inherit; }
    button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--panel); cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:disabled { opacity: .5; cursor: default; }
    .actions { padding: 0 10px 8px; display: flex; gap: 6px; flex-shrink: 0; }
    .actions button { flex: 1; }
    #status { font-size: 11px; color: var(--muted); padding: 0 10px 6px; min-height: 14px; }
    .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted);
            border-top-color: transparent; border-radius: 50%; animation: r 1s linear infinite; vertical-align: -1px; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <b>Spreadsheet AI</b>
    <span id="ctx">loading…</span>
    <select id="profile" title="Model profile"></select>
    <select id="model" title="Model" style="display:none"></select>
  </header>

  <div id="chat"></div>
  <div id="status"></div>

  <div class="actions" id="planActions" style="display:none">
    <button id="approveBtn" class="primary" onclick="doApprove()">Approve</button>
    <button id="applyBtn" onclick="doApply()" style="display:none">Apply</button>
    <button id="undoBtn" onclick="doUndo()" style="display:none">Undo</button>
  </div>

  <div class="bar">
    <textarea id="prompt" placeholder="Ask or request an edit… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="sendBtn" class="primary" onclick="doSend()">Send</button>
  </div>

  <script>
    var STATE = { runId: null, planHash: null, token: null, bundle: null, cap: null, busy: false,
                  streamTimer: null, streamBubble: null };

    // ---- tiny markdown (bold, code, headers, lists, paragraphs) ----
    function md(s) {
      if (!s) return '';
      s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      s = s.replace(/```([\s\S]*?)```/g, function(_, c) { return '<pre><code>' + c.trim() + '</code></pre>'; });
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
      s = s.replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
      s = s.replace(/(<li>[\s\S]*?)(?=<\/li>\s*<li>|<\/li>\s*$)/g, '<ul>$1</ul>');
      s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
      return s;
    }

    function addMsg(who, text) {
      var d = document.createElement('div');
      d.className = 'msg ' + who;
      if (who === 'bot') d.innerHTML = md(text); else d.textContent = text;
      document.getElementById('chat').appendChild(d);
      scrollChat();
      return d;
    }
    function scrollChat() { var c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }

    function setStatus(t) { document.getElementById('status').innerHTML = t || ''; }

    function refreshSelection() {
      google.script.run.withSuccessHandler(function(info) {
        STATE.cap = info;
        document.getElementById('ctx').textContent =
          info.workbook.title + ' · ' + info.selection.a1_range + ' · ' + info.cellCount + ' cells';
      }).captureSelection('selection');
    }

    function loadCapabilities() {
      google.script.run.withSuccessHandler(function(cfg) {
        google.script.run.withSuccessHandler(function(res) {
          var caps = (res && res.body) || {};
          var sel = document.getElementById('profile');
          sel.innerHTML = '';
          (caps.profiles || []).forEach(function(p) {
            var o = document.createElement('option'); o.value = p.id; o.textContent = p.label; sel.appendChild(o);
          });
          if (!sel.options.length) { var o = document.createElement('option'); o.value = 'auto'; o.textContent = 'Auto'; sel.appendChild(o); }

          var modelSel = document.getElementById('model');
          var models = caps.hermes_models || [];
          modelSel.innerHTML = '';
          models.forEach(function(m) {
            var o = document.createElement('option'); o.value = m.id; o.textContent = m.id; modelSel.appendChild(o);
          });
          modelSel.style.display = models.length ? '' : 'none';
          STATE.capInfo = caps;
        }).apiGet('/v1/capabilities');
      }).getClientConfig();
    }

    function newClientRunToken() {
      return 'tok_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    }

    function buildRequest(clientRunToken) {
      var cap = STATE.cap;
      var modelSel = document.getElementById('model');
      var options = { profile: document.getElementById('profile').value, data_class: 'internal', context_scope: 'selection_with_neighbors' };
      if (modelSel.style.display !== 'none' && modelSel.value) { options.model = modelSel.value; }
      if (clientRunToken) { options.client_run_token = clientRunToken; }
      return {
        schema_version: '1.0',
        client: { type: 'google_sheets', version: '0.1.0', tool_versions: { SET_VALUES: '1.0' } },
        workbook: cap.workbook, selection: cap.selection, context: cap.context,
        prompt: document.getElementById('prompt').value.trim(),
        conversation: [],
        options: options
      };
    }

    // ---- pseudo-streaming: poll stream-status in parallel with the blocking
    // :plan call, since Apps Script's UrlFetchApp blocks the caller of :plan
    // itself and cannot read a real SSE/chunked response. ----
    function startStreamPolling(token, bubble) {
      stopStreamPolling();
      STATE.streamTimer = setInterval(function() {
        var timer = STATE.streamTimer;
        google.script.run.withSuccessHandler(function(res) {
          // Ignore replies that arrive after this poll was stopped (bubble
          // already removed by onPlan/onFail) or superseded by a newer send.
          if (STATE.streamTimer !== timer || !bubble.isConnected) return;
          if (!res.ok || !res.body) return;
          var text = res.body.partial_text || '';
          if (text) { bubble.textContent = text; scrollChat(); }
        }).apiGet('/v1/runs/by-token/' + encodeURIComponent(token) + ':stream-status');
      }, 700);
    }

    function stopStreamPolling() {
      if (STATE.streamTimer) { clearInterval(STATE.streamTimer); STATE.streamTimer = null; }
    }

    function endStreamPolling() {
      stopStreamPolling();
      if (STATE.streamBubble) { STATE.streamBubble.remove(); STATE.streamBubble = null; }
    }

    function doSend() {
      var prompt = document.getElementById('prompt').value.trim();
      if (!prompt || !STATE.cap || STATE.busy) return;
      addMsg('user', prompt);
      document.getElementById('prompt').value = '';
      STATE.busy = true; document.getElementById('sendBtn').disabled = true;
      setStatus('<span class="spin"></span> Planning…');
      var token = newClientRunToken();
      STATE.streamBubble = addMsg('bot', '…');
      startStreamPolling(token, STATE.streamBubble);
      google.script.run.withSuccessHandler(onPlan).withFailureHandler(onFail).apiPost('/v1/runs:plan', buildRequest(token));
    }

    function onPlan(res) {
      endStreamPolling();
      STATE.busy = false; document.getElementById('sendBtn').disabled = false;
      if (!res.ok) { setStatus('Error ' + res.status); return; }
      var b = res.body;
      STATE.runId = b.run_id;
      addMsg('bot', b.assistant_message || '');
      if (b.status === 'PREVIEW_READY' && b.plan) {
        STATE.planHash = b.preview ? b.preview.plan_hash : null;
        renderPlan(b);
        setStatus('provider: ' + (b.route ? b.route.provider : '?') + ' · tokens: ' +
          ((b.usage && b.usage.input_tokens) || 0) + '/' + ((b.usage && b.usage.output_tokens) || 0));
      } else {
        setStatus('Provider responded (no editable plan).');
      }
    }

    function renderPlan(b) {
      var plan = b.plan, pv = b.preview || {};
      var d = document.createElement('div'); d.className = 'plan';
      var html = '<h4>Proposed plan · ' + (pv.changed_cells || '?') + ' cells · risk <span class="risk">' + (pv.risk || '?') + '</span></h4>';
      (plan.actions || []).forEach(function(a) {
        html += '<div class="act">▸ <b>' + a.type + '</b>' +
          (a.target && a.target.a1_range ? ' @ ' + a.target.a1_range : '') +
          (a.rationale ? '<br><span style="color:var(--muted)">' + a.rationale + '</span>' : '') + '</div>';
      });
      html += '<div class="meta">provider: ' + (b.route ? b.route.provider + (b.route.model ? ' / ' + b.route.model : '') : '?') + '</div>';
      d.innerHTML = html;
      document.getElementById('chat').appendChild(d); scrollChat();
      document.getElementById('planActions').style.display = 'flex';
      document.getElementById('approveBtn').style.display = '';
      document.getElementById('applyBtn').style.display = 'none';
      document.getElementById('undoBtn').style.display = 'none';
    }

    function doApprove() {
      if (!STATE.runId) return;
      document.getElementById('approveBtn').disabled = true;
      setStatus('<span class="spin"></span> Approving…');
      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('approveBtn').disabled = false;
        if (!res.ok) { setStatus('Approve error ' + res.status); return; }
        STATE.token = res.body.approval_token;
        STATE.bundle = res.body.action_bundle;
        document.getElementById('approveBtn').style.display = 'none';
        document.getElementById('applyBtn').style.display = '';
        setStatus('Approved. Review, then Apply.');
      }).withFailureHandler(onFail).apiPost('/v1/runs/' + STATE.runId + ':approve',
        { plan_hash: STATE.planHash, current_fingerprints: [], confirmation: {} });
    }

    function doApply() {
      if (!STATE.bundle) return;
      document.getElementById('applyBtn').disabled = true;
      setStatus('<span class="spin"></span> Applying to sheet…');
      // local re-validation + execution
      var res = applyBundle(STATE.bundle, STATE.token);
      addMsg('bot', 'Applied: ' + res.status + (res.error ? ' (' + res.error + ')' : ''));
      // report to backend
      google.script.run.withSuccessHandler(function() {
        if (res.status === 'APPLIED') {
          document.getElementById('applyBtn').style.display = 'none';
          document.getElementById('undoBtn').style.display = '';
          setStatus('Done. You can Undo if needed.');
        } else {
          document.getElementById('applyBtn').disabled = false;
          setStatus('Apply failed — see message.');
        }
      }).apiPost('/v1/runs/' + STATE.runId + ':result', {
        apply_attempt_id: 'apply_' + STATE.runId, approval_token: STATE.token,
        status: res.status, started_at: new Date().toISOString(), finished_at: new Date().toISOString(),
        action_results: [], before_snapshot: { encoding: 'cell-matrix-v1', ranges: [] },
        after_snapshot: { encoding: 'cell-matrix-v1', ranges: [] }, error: res.error || null
      });
    }

    function doUndo() {
      document.getElementById('undoBtn').disabled = true;
      setStatus('<span class="spin"></span> Preparing undo…');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.ok) { document.getElementById('undoBtn').disabled = false; setStatus('Undo prep error ' + res.status); return; }
        var before = { encoding: 'cell-matrix-v1', ranges: [] };
        var u = applyBundle(res.body.undo_bundle, res.body.approval_token);
        addMsg('bot', 'Undo: ' + u.status);
        google.script.run.withSuccessHandler(function() {
          document.getElementById('undoBtn').style.display = 'none';
          setStatus('Undone.');
        }).apiPost('/v1/runs/' + STATE.runId + ':undo-result', {
          undo_attempt_id: res.body.undo_attempt_id, approval_token: res.body.approval_token, status: 'RESTORED'
        });
      }).withFailureHandler(onFail).apiPost('/v1/runs/' + STATE.runId + ':prepare-undo',
        { before_snapshot: { encoding: 'cell-matrix-v1', ranges: [] } });
    }

    function onFail(e) {
      endStreamPolling();
      STATE.busy = false; document.getElementById('sendBtn').disabled = false;
      setStatus('Error: ' + (e && e.message ? e.message : e));
    }

    document.getElementById('prompt').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    refreshSelection(); loadCapabilities();
  </script>
</body>
</html>
