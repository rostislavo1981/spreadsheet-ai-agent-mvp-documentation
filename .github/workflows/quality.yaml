name: quality
on: [push, pull_request]
jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "backend[test]"
      - name: Lint
        run: ruff check backend/app || true
      - name: Type check
        run: mypy backend/app || true
      - name: Test (offline, no network/keys)
        run: pytest backend/tests -q
